name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q

  installed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          python -m pip install build tomli
          python -m build
      - name: Resolve parser fixtures from the declared release
        id: parser
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomli

          project = tomli.loads(Path("pyproject.toml").read_text())["project"]
          requirement, = project["optional-dependencies"]["abacuslite"]
          assert requirement.startswith("abacuslite=="), requirement
          version = requirement.removeprefix("abacuslite==")
          record_path, = Path("docs/superpowers/evidence").glob(
              f"*-forge-abacuslite-{version}-package-provenance.json"
          )
          release = json.loads(record_path.read_text())["abacuslite_release"]
          assert release["package_version"] == version
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"commit={release['tag_commit']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          repository: QuantumMisaka/abacuslite
          ref: ${{ steps.parser.outputs.commit }}
          path: .ci-abacuslite
          persist-credentials: false
          sparse-checkout: tests/fixtures/io/testfiles
      - name: Install the built optional-parser package
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install "${wheels[0]}[dev,abacuslite]"
          python -m pip check
          echo "ABACUS_FORGE_WHEEL=$PWD/${wheels[0]}" >> "$GITHUB_ENV"
      - name: Check installed metadata and four-capability parser parity
        env:
          ABACUS_FORGE_INSTALLED_PACKAGE_ONLY: "1"
          ABACUS_FORGE_CANONICAL_ABACUSLITE_FIXTURES: ${{ github.workspace }}/.ci-abacuslite/tests/fixtures/io/testfiles
          PYTHONPATH: ""
        run: |
          test -d "$ABACUS_FORGE_CANONICAL_ABACUSLITE_FIXTURES"
          python -c "import abacuslite; from importlib.metadata import version; print('abacuslite', version('abacuslite'))"
          python -m pytest -q --run-benchmark \
            tests/test_package_contract.py \
            tests/test_package_metadata_drift.py \
            tests/test_parser_backend.py \
            tests/benchmark/test_abacuslite_canonical_parity.py
      - name: Retain tested distributions
        uses: actions/upload-artifact@v4
        with:
          name: forge-distributions-${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
