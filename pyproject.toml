[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abacus-forge"
version = "0.1.0"
description = "Protocol-neutral ABACUS prepare, modify, execute, collect, postprocess, and export library and CLI."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "PAIMON contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "ase",
    "dpdata",
    "matplotlib",
    "numpy",
    "pymatgen",
]

[project.optional-dependencies]
abacuslite = [
    "abacuslite==1.2.2",
]
dev = [
    "packaging>=23",
    "pytest>=7,<9",
    "tomli>=2; python_version < '3.11'",
]
phonon = [
    "phonopy",
]

[project.scripts]
abacus-forge = "abacus_forge.cli:main"

[project.urls]
Repository = "https://github.com/QuantumMisaka/abacus-forge"
Documentation = "https://github.com/QuantumMisaka/abacus-forge/blob/main/docs/README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
    "core: pure input, structure, transformation, and data contracts",
    "integration: prepare/execute/collect/unit/task integration contracts",
    "cli: CLI dispatch and process contracts",
    "compat: ABACUS and abacustest compatibility fixtures",
    "pyatb: optional PyATB bridge contracts",
    "composite: local composite task-pack contracts",
    "experimental: mock/fixture-only property-pack contracts",
    "real_smoke: opt-in process execution against supplied external engine/workspace inputs",
    "benchmark: opt-in compatibility benchmark projections",
]
filterwarnings = [
    "ignore:Set OLD_ERROR_HANDLING to false and catch the errors directly\\.:DeprecationWarning:spglib\\..*",
]
